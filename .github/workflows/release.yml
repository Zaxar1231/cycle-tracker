name: Release

# Релиз выходит сам: когда в main попадает новая версия (значение по умолчанию appVersionName
# в app/build.gradle.kts), для которой ещё нет тега v<версия>, workflow собирает подписанный APK,
# создаёт тег и релиз. Приложение находит релиз через «Настройки → Обновления».
# Пуш тега v1.2 вручную тоже по-прежнему работает.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -oP 'removePrefix\("v"\) \?: "\K[^"]+' app/build.gradle.kts)
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "Версия $version уже выпущена (тег v$version есть) — новый релиз не нужен."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::Не удалось определить версию из app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Use signing key from secrets (optional)
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Без секретов используется ключ из signing/release.p12.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Build signed APK
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersion="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cycle-tracker-v$VERSION.apk"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: My Cycle v${{ steps.version.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
