name: Release

# Создаёт релиз на GitHub при пуше тега вида v1.2 (git tag v1.2 && git push origin v1.2).
# Приложение находит этот релиз через «Настройки → Обновления» и предлагает установить APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета RELEASE_KEYSTORE_BASE64. Без ключа, которым подписан прошлый релиз, обновление не встанет поверх установленного приложения."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersion="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cycle-tracker-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: My Cycle ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
